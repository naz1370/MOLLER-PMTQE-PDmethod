<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMT Photocathode Sensitivity Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1b2a;color:#e0e8f0;font-family:'Segoe UI',sans-serif;padding:14px;}
h1{color:#7ec8f7;font-size:20px;text-align:center;margin-bottom:3px;}
.sub{color:#a0b8cc;font-size:12px;text-align:center;margin-bottom:12px;}
.panel{background:#1e2a3a;border-radius:12px;padding:13px;margin-bottom:12px;}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
label.hdr{color:#7ec8f7;font-size:12px;font-weight:bold;display:block;margin-bottom:7px;}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;}
button{padding:6px 13px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:bold;background:#0d1b2a;color:#a0b8cc;transition:.15s;}
button:hover{filter:brightness(1.25);}
button.on{background:#4a90d9;color:#fff;}
button.green{background:#43e97b;color:#06210f;}
button.red{background:#ff6b6b;color:#2a0a0a;}
button.grey{background:#37475a;color:#dfe8f0;}
.info{background:#0d1b2a;border-radius:8px;padding:9px 13px;min-width:150px;font-size:12px;}
.info .v{color:#ffd700;font-weight:bold;font-size:15px;margin-top:3px;}
.info .d{color:#a0b8cc;margin-top:2px;}
input[type=text]{background:#0d1b2a;border:1px solid #4a90d9;border-radius:6px;color:#e0e8f0;padding:6px 10px;font-size:12px;width:220px;}
.chart-wrap{background:#1e2a3a;border-radius:12px;padding:14px;position:relative;}
canvas{display:block;}
.cl-wrap{background:#1e2a3a;border-radius:12px;padding:12px;margin-top:12px;}
.cl-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px;}
.cl-head h3{color:#7ec8f7;font-size:12px;}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:4px;max-height:330px;overflow-y:auto;padding-right:5px;}
.cl-item{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;background:#0d1b2a;border:1px solid #2a3a4a;font-size:11px;cursor:pointer;user-select:none;}
.cl-item:hover{border-color:#4a90d9;}
.cl-item.off{opacity:.34;}
.cl-item.nodata{opacity:.3;cursor:not-allowed;font-style:italic;}
.cl-box{width:13px;height:13px;border-radius:3px;border:2px solid #6d8399;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#0d1b2a;font-weight:bold;}
.cl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.r2tag{font-size:9px;background:#f58231;color:#2a1400;border-radius:3px;padding:0 4px;font-weight:bold;}
#tip{position:fixed;display:none;background:#1e2a3a;border:1px solid #4a90d9;border-radius:8px;padding:7px 11px;font-size:12px;pointer-events:none;z-index:99;}
.foot{text-align:center;color:#2f4256;font-size:10px;margin-top:11px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#16222f;}
::-webkit-scrollbar-thumb{background:#4a90d9;border-radius:3px;}
</style>
</head>
<body>

<h1>PMT Photocathode Sensitivity Dashboard</h1>
<p class="sub" id="subLine"></p>

<div class="panel">
  <div class="row">
    <div>
      <label class="hdr">📊 Y-Axis Variable</label>
      <div class="btn-row" id="yBtns"></div>
    </div>
    <div>
      <label class="hdr">🔍 Search / Filter list</label>
      <input type="text" id="search" placeholder="Type serial e.g. B24 or R2..." oninput="renderList()"/>
    </div>
    <div class="info">
      <div style="color:#a0b8cc;">Currently plotted</div>
      <div class="v" id="iCount">—</div>
      <div class="d" id="iY">Y: S(C)/e</div>
      <div class="d">X: I (nA)</div>
    </div>
  </div>
</div>

<div class="chart-wrap"><canvas id="chart"></canvas></div>
<p style="color:#a0b8cc;font-size:11px;text-align:center;margin-top:5px;" id="chartLabel"></p>

<div class="cl-wrap">
  <div class="cl-head">
    <h3>☑️ PMT Checklist — uncheck to hide from plot</h3>
    <div class="btn-row">
      <button class="green" onclick="setAll(true)">Select All</button>
      <button class="red" onclick="setAll(false)">Deselect All</button>
      <button class="grey" onclick="onlyR2()">Only R2 runs</button>
      <button class="grey" onclick="hideR2()">Hide R2 runs</button>
      <button class="grey" onclick="invert()">Invert</button>
    </div>
  </div>
  <div class="cl-grid" id="clGrid"></div>
</div>

<div id="tip"></div>
<div class="foot">PMT Photocathode Sensitivity · MOLLER Experiment · University of Manitoba</div>

"F24-1262 R2":[[0.123,0.5987,3.698e-20,0.230808,8.056],[0.461,4.5777,3.81145e-20,0.237888,59.763],[0.754,8.5713,3.80694e-20,0.237607,112.033],[1.015,12.2367,3.79925e-20,0.237127,160.267],[1.337,16.8,3.79006e-20,0.236554,220.567],[1.49,18.98,3.78482e-20,0.236226,249.533],[1.59,20.35,3.76761e-20,0.235152,268.767],[1.799,22.7733,3.6657e-20,0.228792,309.133],[2.071,24.7433,3.38805e-20,0.211462,363.4],[2.461,27.3,3.09863e-20,0.193398,438.4],[2.983,28.8033,2.64745e-20,0.165238,541.367]],
};

const YKEYS=["I_LED","I_nA","S_C","S_C_e","PPD_nW"];
const YLAB={I_LED:"I_LED (mA)",I_nA:"I (nA)",S_C:"S(C)",S_C_e:"S(C)/e",PPD_nW:"PPD (nW)"};
const YIDX={I_LED:0,I_nA:1,S_C:2,S_C_e:3,PPD_nW:4};
const NAMES=Object.keys(RAW);
const COLORS=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#c8a000","#469990","#dcbeff","#9A6324","#ffd700","#a03030","#7fffd4","#9aa000","#ffb27f","#4a90d9","#9aa8b5","#ff6b6b","#00f2fe","#e6beff","#00a0a0","#c9e265","#ff8fa3","#5ac85a","#5f7fe8","#ffa64d","#b45ce0","#6fdcf5","#f57fe0","#d4f06a","#e0b000","#5fbfa0","#c3a8ff","#c08040","#fff07a","#c05050","#a0ffd0","#c0c840","#ffcda8","#6fa8e8","#c0ccd8","#ff9a9a","#66f7ff","#f0d8ff","#33c0c0","#dbea90","#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6"];

let yKey="S_C_e";
const on={}; NAMES.forEach(n=>on[n]=RAW[n].length>0);
const idxOf={}; NAMES.forEach((n,i)=>idxOf[n]=i);
const col=n=>COLORS[idxOf[n]%COLORS.length];
const isR2=n=>/\bR2\b/.test(n);
const hasData=n=>RAW[n].length>0;

document.getElementById("subLine").textContent =
  NAMES.length+" entries total ("+NAMES.filter(hasData).length+" with data, "+
  NAMES.filter(n=>!hasData(n)).length+" empty) · "+NAMES.filter(isR2).length+" are R2 second-round runs";

/* Y buttons */
const yb=document.getElementById("yBtns");
YKEYS.forEach(k=>{
  const b=document.createElement("button");
  b.textContent=YLAB[k]; b.id="yb_"+k;
  if(k===yKey)b.className="on";
  b.onclick=()=>{yKey=k;YKEYS.forEach(x=>document.getElementById("yb_"+x).className=(x===yKey?"on":""));draw();info();};
  yb.appendChild(b);
});

/* checklist */
function renderList(){
  const q=document.getElementById("search").value.toLowerCase();
  const g=document.getElementById("clGrid"); g.innerHTML="";
  NAMES.filter(n=>n.toLowerCase().includes(q)).forEach(n=>{
    const d=document.createElement("div");
    const nd=!hasData(n);
    d.className="cl-item"+(nd?" nodata":(on[n]?"":" off"));
    d.innerHTML=`<div class="cl-box" style="background:${on[n]&&!nd?col(n):'transparent'};border-color:${nd?'#4a5866':col(n)}">${on[n]&&!nd?'✓':''}</div>`+
                `<div class="cl-dot" style="background:${nd?'#4a5866':col(n)}"></div>`+
                `<span>${n.replace(/ R2$/,'')}</span>`+(isR2(n)?`<span class="r2tag">R2</span>`:'')+
                (nd?`<span style="color:#7a8894;font-size:9px;">no data</span>`:'');
    if(!nd) d.onclick=()=>{on[n]=!on[n];renderList();draw();info();};
    g.appendChild(d);
  });
}
function setAll(v){NAMES.forEach(n=>{if(hasData(n))on[n]=v;});renderList();draw();info();}
function onlyR2(){NAMES.forEach(n=>{if(hasData(n))on[n]=isR2(n);});renderList();draw();info();}
function hideR2(){NAMES.forEach(n=>{if(hasData(n))on[n]=!isR2(n);});renderList();draw();info();}
function invert(){NAMES.forEach(n=>{if(hasData(n))on[n]=!on[n];});renderList();draw();info();}

function info(){
  const n=NAMES.filter(x=>on[x]&&hasData(x)).length;
  document.getElementById("iCount").textContent=n+" / "+NAMES.filter(hasData).length+" PMTs";
  document.getElementById("iY").textContent="Y: "+YLAB[yKey];
  document.getElementById("chartLabel").textContent=n+" series shown · Y: "+YLAB[yKey]+" vs X: I (nA)";
}

/* chart */
const cv=document.getElementById("chart"), tip=document.getElementById("tip");
let hits=[];
const fmt=v=>{if(!isFinite(v))return"";const a=Math.abs(v);
  if(a>0&&(a<1e-3||a>1e5))return v.toExponential(2);
  return parseFloat(v.toPrecision(5)).toString();};

function draw(){
  const DPR=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth-28, H=Math.min(500,Math.max(340,window.innerHeight*0.52));
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";
  const c=cv.getContext("2d");c.setTransform(DPR,0,0,DPR,0,0);
  const P={t:18,r:22,b:52,l:78}, pw=W-P.l-P.r, ph=H-P.t-P.b, yi=YIDX[yKey];
  const act=NAMES.filter(n=>on[n]&&hasData(n));

  c.fillStyle="#1e2a3a";c.fillRect(0,0,W,H);
  c.fillStyle="#152331";c.fillRect(P.l,P.t,pw,ph);
  if(!act.length){c.fillStyle="#7a8fa3";c.font="13px Segoe UI";c.textAlign="center";
    c.fillText("No PMTs selected — check some boxes below",P.l+pw/2,P.t+ph/2);return;}

  let X=[],Y=[];
  act.forEach(n=>RAW[n].forEach(r=>{X.push(r[1]);if(isFinite(r[yi]))Y.push(r[yi]);}));
  const xmn=Math.min(...X),xmx=Math.max(...X),ymn=Math.min(...Y),ymx=Math.max(...Y);
  const xp=(xmx-xmn)*0.04||1, yp=(ymx-ymn)*0.08||0.01;
  const X0=Math.max(0,xmn-xp),X1=xmx+xp,Y0=Math.max(0,ymn-yp),Y1=ymx+yp;
  const px=v=>P.l+(v-X0)/(X1-X0)*pw, py=v=>P.t+ph-(v-Y0)/(Y1-Y0)*ph;

  c.strokeStyle="#2a3a4a";c.lineWidth=1;c.setLineDash([]);
  for(let i=0;i<=6;i++){const v=X0+(X1-X0)*i/6,x=px(v);
    c.beginPath();c.moveTo(x,P.t);c.lineTo(x,P.t+ph);c.stroke();
    c.fillStyle="#a0b8cc";c.font="10px Segoe UI";c.textAlign="center";c.fillText(fmt(v),x,P.t+ph+16);}
  for(let i=0;i<=6;i++){const v=Y0+(Y1-Y0)*i/6,y=py(v);
    c.beginPath();c.moveTo(P.l,y);c.lineTo(P.l+pw,y);c.stroke();
    c.fillStyle="#a0b8cc";c.font="10px Segoe UI";c.textAlign="right";c.fillText(fmt(v),P.l-7,y+3);}

  if(yKey==="S_C_e"&&Y0<0.24&&0.24<Y1){const y=py(0.24);
    c.strokeStyle="#ffd700";c.lineWidth=1.4;c.setLineDash([6,4]);
    c.beginPath();c.moveTo(P.l,y);c.lineTo(P.l+pw,y);c.stroke();c.setLineDash([]);
    c.fillStyle="#ffd700";c.font="10px Segoe UI";c.textAlign="left";c.fillText("0.24",P.l+4,y-4);}

  c.fillStyle="#a0b8cc";c.font="13px Segoe UI";c.textAlign="center";
  c.fillText("Photocurrent I (nA)",P.l+pw/2,H-8);
  c.save();c.translate(17,P.t+ph/2);c.rotate(-Math.PI/2);c.fillText(YLAB[yKey],0,0);c.restore();
  c.strokeStyle="#3a4a5a";c.lineWidth=1.4;c.strokeRect(P.l,P.t,pw,ph);

  hits=[];
  const solo=act.length===1;
  act.forEach(n=>{
    const K=col(n), pts=RAW[n].map(r=>({x:r[1],y:r[yi]})).filter(p=>isFinite(p.y));
    if(!pts.length)return;
    c.strokeStyle=K;c.lineWidth=solo?2.4:1.3;c.setLineDash(isR2(n)?[6,3]:[]);
    c.beginPath();pts.forEach((p,i)=>{const a=px(p.x),b=py(p.y);i?c.lineTo(a,b):c.moveTo(a,b);});c.stroke();
    c.setLineDash([]);
    pts.forEach(p=>{const a=px(p.x),b=py(p.y);
      c.beginPath();c.arc(a,b,solo?4:2.8,0,6.2832);c.fillStyle=K;c.fill();
      hits.push({a,b,n,x:p.x,y:p.y,K});});
  });
}

cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let f=null;for(const h of hits){if(Math.hypot(mx-h.a,my-h.b)<7){f=h;break;}}
  if(f){tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-8)+"px";
    tip.innerHTML=`<b style="color:${f.K}">${f.n}</b><br>I(nA) = ${fmt(f.x)}<br>${YLAB[yKey]} = ${fmt(f.y)}`;
    cv.style.cursor="crosshair";}
  else{tip.style.display="none";cv.style.cursor="default";}
});
cv.addEventListener("mouseleave",()=>tip.style.display="none");
window.addEventListener("resize",draw);

renderList();draw();info();
</script>
